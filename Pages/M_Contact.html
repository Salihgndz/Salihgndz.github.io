<script>
async function handleFormSubmit(event) {
    event.preventDefault();
    const form = event.target;
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('formStatus');

    // Butonu devre dışı bırak ve yükleniyor göster
    submitBtn.disabled = true;
    submitBtn.innerText = "Gönderiliyor...";
    statusDiv.classList.add('hidden');

    try {
        const response = await fetch(form.action, {
            method: form.method,
            body: new FormData(form),
            headers: {
                'Accept': 'application/json'
            }
        });

        if (response.ok) {
            statusDiv.className = "mt-4 p-3 rounded-xl text-center font-semibold text-sm bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            statusDiv.innerText = "✓ Mesajınız başarıyla iletildi!";
            statusDiv.classList.remove('hidden');
            form.reset();

            // 3 Saniye sonra modalı kapat
            setTimeout(() => {
                document.getElementById('emailModal').classList.add('hidden');
                statusDiv.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = "Gönder";
            }, 3000);
        } else {
            throw new Error("Form gönderilemedi.");
        }
    } catch (error) {
        statusDiv.className = "mt-4 p-3 rounded-xl text-center font-semibold text-sm bg-rose-500/20 text-rose-400 border border-rose-500/30";
        statusDiv.innerText = "✕ Bir sorun oluştu. Lütfen tekrar deneyin.";
        statusDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = "Gönder";
    }
}
</script>
